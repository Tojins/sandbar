<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbar Pool</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f8; --panel:#fff; --line:#d7dde5; --ink:#1b2330; --ink2:#556170; --ink3:#8a95a3; --accent:#1f6f78; --good:#2e7d4f; --warn:#a86a0c; --bad:#b3362d; --run:#2f5fb3; --goodsoft:#dff1e5; --soft:#eaeef2; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --sans:system-ui,-apple-system,"Segoe UI",sans-serif }
  @media (prefers-color-scheme:dark) { :root { --bg:#12171e;--panel:#1a2029;--line:#303a47;--ink:#e4e9f0;--ink2:#a9b4c2;--ink3:#74808f;--accent:#5fb7c0;--good:#6cc48f;--warn:#e2a94a;--bad:#ef7f74;--run:#7fa7ee;--goodsoft:#1b3326;--soft:#222a35 } }
  * { box-sizing:border-box } body { margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums }
  .page { max-width:960px;margin:auto;padding:28px 24px 60px;display:grid;gap:28px }.mono,.id { font-family:var(--mono) }.id { font-weight:600 }.dim { color:var(--ink3) }.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  h2 { margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3) }.ellip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top { display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;color:var(--ink2) }.name{font-size:16px;font-weight:600;color:var(--ink)}.pill{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500}.pill.live{background:var(--goodsoft);color:var(--good)}.pill.ended{background:var(--soft)}.pill.crashed{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}.warnline,.gone{flex-basis:100%;color:var(--warn);font-size:13px}.gone{padding:7px 10px;border:1px solid var(--warn);border-radius:4px}
  .axis{position:relative;height:18px;font:11px var(--mono);color:var(--ink3)}.axis span{position:absolute;transform:translateX(-50%)}.axis .nowlab{color:var(--run)}.row{display:grid;gap:4px;padding:9px 0 10px;border-top:1px solid var(--line)}.l1{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:baseline}.st{font:13px var(--mono);white-space:nowrap}.since{color:var(--ink3)}.lane{position:relative;height:18px}.bar{position:absolute;top:1px;height:16px;border-radius:3px;font:11px/16px var(--mono);padding:0 6px;color:#fff;overflow:hidden;white-space:nowrap;min-width:2px}.bar.impl{background:var(--run)}.bar.review{background:var(--accent)}.bar.review.no{background:var(--bad)}.bar.running{opacity:.8;border:1px dashed rgba(255,255,255,.75)}.nowline{position:absolute;top:-2px;bottom:-2px;border-left:1px dashed var(--run)}.legend{display:flex;gap:18px;font:11px var(--mono);color:var(--ink3);padding-top:8px;border-top:1px solid var(--line)}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  .waitrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:5px 0;color:var(--ink2);align-items:baseline}.why{font:12px var(--mono);color:var(--ink3);white-space:nowrap}.fin{display:grid;gap:3px;font-size:13px}.fin>div{display:grid;grid-template-columns:56px minmax(0,1fr) 170px 170px;gap:14px;align-items:baseline}.o,.r{font:12px var(--mono)}.r{color:var(--ink3);text-align:right;white-space:nowrap}details summary{cursor:pointer;list-style:none;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}details summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}.feed{display:grid;gap:3px;font:12.5px var(--mono);padding-top:8px}.feed>div{display:grid;grid-template-columns:44px 44px minmax(0,1fr);gap:12px}.empty{padding:5px 0;color:var(--ink3)}
  @media(max-width:700px){.l1,.waitrow{grid-template-columns:44px minmax(0,1fr)}.st,.why{grid-column:2}.fin>div{grid-template-columns:44px minmax(0,1fr)}.fin .o,.fin .r{grid-column:2;text-align:left}.legend{flex-wrap:wrap}}
</style>
</head>
<body><main id="app" class="page" aria-live="polite"></main>
<script>
let lastState = null;
const esc = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const parse = value => Date.parse(value);
function dur(ms) { const m=Math.max(0,Math.round(ms/60000)); return m<60?`${m}m`:`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}` }
const since = (iso,now) => dur(parse(now)-parse(iso));
const hhmm = iso => new Date(iso).toISOString().slice(11,16);
const shortDate = iso => new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
const firstLine = text => String(text||"").split(/\r?\n/,1)[0];
const outcomeClass = value => value === "DONE" ? "good" : value === "NEEDS-INFO" ? "warn" : "bad";
function notice(text) { return `<div class="gone">${esc(text)}</div>` }
function render(state, serverNotice=null) {
  lastState=state; const r=state.run, now=parse(state.now), t0=parse(r.startedAt), t1=Math.max(now+300000,t0+300000), width=t1-t0;
  const x=iso => Math.max(0,Math.min(100,(parse(iso)-t0)/width*100)).toFixed(2)+"%";
  const w=(from,to) => Math.max(.2,((to?parse(to):now)-parse(from))/width*100).toFixed(2)+"%";
  const ticks=[]; for(let t=Math.ceil(t0/1800000)*1800000;t<t1;t+=1800000) ticks.push(`<span style="left:${((t-t0)/width*100).toFixed(2)}%">${hhmm(new Date(t).toISOString())}</span>`);
  const pill=r.status==="live"?`<span class="pill live"><span class="dot"></span>live · ${since(r.startedAt,state.now)}</span>`:`<span class="pill ${r.status}">${r.status}${r.exit?` · ${esc(r.exit.tag)}`:""}</span>`;
  const top=`<header class="top"><span class="name">${esc(r.driver)}</span>${pill}<span>${r.slots.used}/${r.slots.max} slots</span>${r.lastRecompute?`<span class="dim mono">recompute ${r.lastRecompute.n} · ${esc(r.lastRecompute.trigger)} · ${hhmm(r.lastRecompute.at)}</span>`:""}${serverNotice?notice(serverNotice):""}${r.complaints.length?`<div class="warnline">⚠ ${r.complaints.map(c=>esc(c.text)).join(" · ")}</div>`:""}</header>`;
  // Startup is deliberately one row. Preflight/image detail is still in the
  // event record, but the ledger appears only once the first pool observation
  // exists and there is scheduler state worth rendering.
  if(!r.lastRecompute){document.getElementById("app").innerHTML=top+`<section><h2>Startup</h2><div class="empty">Preparing run…</div></section>`;return}
  const lane=spans=>`<div class="lane">${spans.map(sp=>`<span class="bar ${sp.kind} ${sp.verdict||""} ${sp.to?"":"running"}" style="left:${x(sp.from)};width:${w(sp.from,sp.to)}" title="${esc(sp.label)}">${esc(sp.label)}</span>`).join("")}<span class="nowline" style="left:${x(state.now)}"></span></div>`;
  const pool=`<section><h2>In the pool</h2>${state.pool.length?`<div class="axis">${ticks.join("")}<span class="nowlab" style="left:${x(state.now)}">now</span></div>${state.pool.map(p=>`<div class="row"><div class="l1"><span class="id">#${p.issue}</span><span class="ellip">${esc(p.title)}</span><span class="st">${esc(p.phase)} <span class="since">${since(p.phaseSince,state.now)}</span> · attempt ${p.attempt}</span></div>${lane(p.spans)}</div>`).join("")}<div class="legend"><span><i style="background:var(--run)"></i>implementer</span><span><i style="background:var(--accent)"></i>gate + review</span><span><i style="background:var(--bad)"></i>changes requested</span></div>`:`<div class="empty">${r.lastRecompute?"No issues in flight.":"Preparing run…"}</div>`}</section>`;
  const waiting=`<section><h2>Waiting</h2>${state.waiting.length?state.waiting.map(v=>`<div class="waitrow"><span class="id">#${v.issue}</span><span class="ellip">${esc(v.title)}</span><span class="why ${v.parked?"bad":""}">${esc(v.why)}</span></div>`).join(""):`<div class="empty">Nothing waiting.</div>`}</section>`;
  const finished=`<section><h2>Finished recently</h2><div class="fin">${state.finished.map(f=>`<div><span class="id">#${f.issue}</span><span class="ellip">${esc(f.title)}</span><span class="o ${outcomeClass(f.outcome)}">${esc(f.outcome)}${f.outcome==="DONE"&&f.landed?` → ${esc(f.landed)}`:""}${f.reason?` · ${esc(firstLine(f.reason))}`:""}</span><span class="r">${f.attempts} att · ${f.rounds} rev · ${dur(f.ms)} · ${shortDate(f.at)}</span></div>`).join("")}</div></section>`;
  // The page is rebuilt on every poll, so a <details> the reader opened would
  // snap shut two seconds later unless its state is carried across renders.
  const eventsOpen=document.getElementById("events")?.open?" open":"";
  const events=`<details id="events"${eventsOpen}><summary>Events · ${state.eventCount}</summary><div class="feed">${state.events.map(e=>`<div class="${e.tone}"><span class="dim">${hhmm(e.at)}</span><span class="${e.tone?"":"dim"}">${e.issue?`#${e.issue}`:"run"}</span><span>${esc(e.text)}</span></div>`).join("")}</div></details>`;
  document.getElementById("app").innerHTML=top+pool+waiting+finished+events;
}
// A failed poll never leaves the page blank or stale without saying so: a
// network failure means no run is serving (a relaunch on the same port picks
// the tab back up), and a non-OK response carries the server's message — a
// corrupt record or a reducer fault on a run that is still live.
function failed(text) { if(lastState)render(lastState,text); else document.getElementById("app").innerHTML=`<header class="top">${notice(text)}</header>` }
async function poll(){
  let response;
  try { response=await fetch("/state.json",{cache:"no-store"}) }
  catch(_networkError) { failed("No run is serving; last state below. Reconnecting…"); return }
  if(!response.ok){ failed(`State request failed (${response.status}): ${await response.text()}`); return }
  const state=await response.json();
  render(state);
}
poll(); setInterval(poll,2000);
</script></body></html>
