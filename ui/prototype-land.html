  const waiting=`<section><h2>Waiting</h2>${state.waiting.map(v=>`<div class="waitrow"><span class="id">#${v.issue}</span><span class="ellip">${esc(v.title)}</span><span class="why clamp">${esc(v.why)}</span></div>`).join("")||`<div class="empty">Nothing waiting.</div>`}</section>`;
  const finRows=[...state.finished.map(f=>({t:parse(f.at), html:`<div><span class="id">#${f.issue}</span><span class="ellip" title="${esc(f.title)}">${esc(f.title)}</span><span class="o clamp ${outcomeClass(f.outcome)}">${esc(f.outcome)}${f.landed?` → ${esc(f.landed.replace(/^sandbar\//,"").slice(0,26))}…`:""}</span><span class="r">${f.attempts} att · ${f.rounds} rev · ${dur(f.ms)} · ${shortDate(f.at)}</span></div>`})),
    ...L.recent.filter(c=>c.kind==="chunk").map(c=>({t:parse(c.at), html:`<div><span class="id">PR #${c.pr}</span><span class="ellip" title="${esc(c.title)}">${esc(c.title)}</span><span class="o good">LANDED → ${esc(c.target)} · ${c.members.map(m=>"#"+m).join(" ")}</span><span class="r">landing ${dur(c.ms)} · ${shortDate(c.at)}</span></div>`}))]
    .sort((a,b)=>b.t-a.t).slice(0,8);
  const finished=`<section><h2>Finished recently</h2><div class="fin">${finRows.map(r=>r.html).join("")}</div></section>`;
  const status=q=>{
    const unit=L.current?.units.find(u=>u.kind==="chunk"&&u.pr===q.pr);
    if(unit){const st=unit.steps.at(-1);return{kind:"landing",tone:"run",word:curStep(unit),since:st.to??st.from,reason:[L.current.units.filter(o=>o!==unit).length?`landing together with ${L.current.units.filter(o=>o!==unit).map(o=>o.kind==="issue"?`#${o.issue} → its chunk`:`PR #${o.pr}`).join(", ")}`:null,`requested ${since(q.seenAt,state.now)} ago`].filter(Boolean).join(" · ")}}
    if(q.state==="deferred")return{kind:"deferred",tone:"dim",word:"deferred",since:q.seenAt,reason:q.why.replace(/^deferred · /,"")};
    return{kind:"queued",tone:"dim",word:"queued",since:q.seenAt,reason:q.why.replace(/^queued · /,"")};
  };
  const members=q=>`<span class="chips">${q.members.map(m=>"#"+m).join(" ")}</span>`;
  const head=`<h2>Landing · ${L.requests.length} requested</h2>`;
  const empty=`<div class="empty">No land requests.</div>`;

  // ---- A: pool-row shape — status on the right like a pool row's phase, reason beneath
  const A = () => pool+waiting+`<section>${head}${L.requests.map(q=>{const s=status(q);return `<div class="row"><div class="l1"><span class="id">PR #${q.pr}</span><span class="ellip" title="${esc(q.title)}">${esc(q.title)} ${members(q)}</span><span class="st ${s.tone==="dim"?"":s.tone}">${esc(s.word)} <span class="since">${since(s.since,state.now)}</span></span></div><div class="why" style="padding-left:88px">${esc(s.reason)}</div></div>`}).join("")||empty}</section>`+finished;

  // ---- B: waiting-row shape — one line, status word leads the reason column
  const B = () => pool+waiting+`<section>${head}${L.requests.map(q=>{const s=status(q);return `<div class="waitrow"><span class="id">PR #${q.pr}</span><span class="ellip" title="${esc(q.title)}">${esc(q.title)} ${members(q)}</span><span class="why clamp" title="${esc(s.reason)}"><b class="${s.tone==="run"?"":s.tone}" style="${s.tone==="run"?"color:var(--run)":""}">${esc(s.word)} ${since(s.since,state.now)}</b> · ${esc(s.reason)}</span></div>`}).join("")||empty}</section>`+finished;

  // ---- C: board row with ONE status pill (no ladder), reason beneath
  const C = () => pool+waiting+`<section>${head}<div class="board">${L.requests.map(q=>{const s=status(q);return `<div><span class="id">PR #${q.pr}</span><span class="ellip" title="${esc(q.title)}">${esc(q.title)} ${members(q)}</span><span><span class="spill ${s.tone}">${s.kind==="landing"?'<span class="dot"></span>':""}${esc(s.word)} · ${since(s.since,state.now)}</span></span><span class="r dim">requested ${hhmm(q.seenAt)}</span><span class="why clamp">${esc(s.reason)}</span></div>`}).join("")||empty}</div></section>`+finished;

  const VARIANTS={A:["Pool-row status",A],B:["Waiting-row status",B],C:["Board + status pill",C]};
  const [vname, fn] = VARIANTS[v]||VARIANTS.A;
  document.getElementById("app").innerHTML = top + fn() + `<details><summary>Events · ${SNAP.eventCount}</summary><div class="dim" style="padding-top:8px">(unchanged — see ui/index.html)</div></details>`;
  const keys=Object.keys(VARIANTS), i=keys.indexOf(v in VARIANTS?v:"A");
  document.getElementById("proto").innerHTML = `<button data-v="${keys[(i+keys.length-1)%keys.length]}">‹</button><span>${keys[i]} (${vname})</span><button data-v="${keys[(i+1)%keys.length]}">›</button><span style="opacity:.5">|</span>${Object.entries(SCEN).map(([k,s])=>`<button data-s="${k}" class="${k===sc?"on":""}">${esc(s.label)}</button>`).join("")}`;
}
function go(p) { const q=new URLSearchParams(location.search); for (const [k,val] of Object.entries(p)) q.set(k,val); history.replaceState(null,"","?"+q); render(); }
document.getElementById("proto").addEventListener("click", e => { const b=e.target.closest("button"); if(!b) return; if(b.dataset.v) go({variant:b.dataset.v}); if(b.dataset.s) go({scenario:b.dataset.s}); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  const keys=["A","B","C"], cur=new URLSearchParams(location.search).get("variant")||"A", i=Math.max(0,keys.indexOf(cur));
  go({variant: keys[(i+(e.key==="ArrowRight"?1:keys.length-1))%keys.length]});
});
render();
</script></body></html>
