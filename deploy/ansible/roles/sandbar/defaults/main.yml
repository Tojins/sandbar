---
# Host-wide defaults. Each daemon is one entry in `sandbar_installations`;
# tasks/installation.yml derives its user, home, checkout and installation
# paths from that entry rather than keeping a second scalar configuration.
sandbar_ubuntu_releases:
  - "24.04"
  - "26.04"

# Required list. Every entry names `user`, `project`, `clone_url`, and
# `reader_port`; `driver_tag` and `config_src` are optional.
sandbar_installations: []

# Exact driver tag used when an installation does not override it. Branches,
# ranges and commits are deliberately refused: a restart must be repeatable.
sandbar_driver_tag: github:Tojins/sandbar#v0.39.7

sandbar_stop_timeout_sec: 900

# Caddy serves an installation index at `/` and each reader at `/<project>/`.
sandbar_ui_http_port: 80
# The static index page lives here; every other path is an installation route.
sandbar_ui_root: /var/www/sandbar

# An installation may override either identity in its inventory entry.
sandbar_git_name: sandbar-bot
sandbar_git_email: ""

# Exclusive for root and every installation user.
sandbar_operator_ssh_keys: []

sandbar_node_major: 24
sandbar_swap_size_mb: 4096

# Each installation gets `base + installation index * count`.
sandbar_subid_base: 200000
sandbar_subid_count: 65536

# Local to every clone: this never becomes a consumer repository requirement.
sandbar_work_dir: .sandbar
sandbar_secret_mode: "0600"
