---
- name: Create the installation user
  ansible.builtin.user:
    name: "{{ sandbar_user }}"
    home: "{{ sandbar_home }}"
    shell: /bin/bash
    create_home: true
    state: present
  register: sandbar_user_result

# The range is written into every file a rootless layer store holds: an image
# layer's files are owned by host uids inside it. A range that moves under an
# existing store therefore leaves files the new user namespace can neither
# read as its own nor unlink -- podman fails on `error removing stale temp dir
# ... permission denied` at the next storage open, and `podman system migrate`
# re-owns nothing. So the slot is permanent for the life of the store, and a
# change is refused while the store exists rather than half-applied.
- name: Read the installation user's recorded subordinate id ranges
  ansible.builtin.command: grep -h "^{{ sandbar_user }}:" /etc/subuid /etc/subgid
  register: sandbar_subid_lines
  changed_when: false
  failed_when: sandbar_subid_lines.rc not in [0, 1, 2]

- name: Check for the installation user's rootless podman storage
  ansible.builtin.stat:
    path: "{{ sandbar_home }}/.local/share/containers/storage"
  register: sandbar_podman_storage

- name: Refuse to move a subordinate id range under existing podman storage
  ansible.builtin.assert:
    that:
      - not sandbar_podman_storage.stat.exists
        or (sandbar_subid_lines.stdout_lines | reject('equalto', sandbar_user ~ ':' ~ sandbar_subid_start ~ ':' ~ sandbar_subid_count) | list | length) == 0
    fail_msg: >-
      {{ sandbar_user }}'s subordinate id range is recorded as
      {{ sandbar_subid_lines.stdout_lines | join(' and ') }} but subid_slot now
      asks for {{ sandbar_user }}:{{ sandbar_subid_start }}:{{ sandbar_subid_count }},
      and {{ sandbar_home }}/.local/share/containers/storage still holds files
      owned inside the recorded range. Either restore the entry's previous
      subid_slot, or stop the installation's units and remove that storage
      directory (its images are rebuilt at the next run) before changing it.

- name: Give the installation user disjoint subordinate id ranges
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ sandbar_user }}:"
    line: "{{ sandbar_user }}:{{ sandbar_subid_start }}:{{ sandbar_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Enable linger for the installation user
  ansible.builtin.command: loginctl enable-linger {{ sandbar_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ sandbar_user }}"

- name: Wait for the installation user's manager to come up
  ansible.builtin.wait_for:
    path: "/run/user/{{ sandbar_user_result.uid }}/bus"
    timeout: 30

- name: Authorize the operator's keys for the installation user, and no others
  ansible.posix.authorized_key:
    user: "{{ sandbar_user }}"
    key: "{{ sandbar_operator_ssh_keys | join('\n') }}"
    exclusive: true

- name: Set the installation user's git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: user.name, value: "{{ sandbar_installation_git_name }}" }
    - { name: user.email, value: "{{ sandbar_installation_git_email }}" }
  become: true
  become_user: "{{ sandbar_user }}"

- name: Route GitHub HTTPS credentials through gh
  community.general.git_config:
    name: credential.https://github.com.helper
    value: "!/usr/bin/gh auth git-credential"
    scope: global
  become: true
  become_user: "{{ sandbar_user }}"
