---
- name: Create the installation user
  ansible.builtin.user:
    name: "{{ sandbar_user }}"
    home: "{{ sandbar_home }}"
    shell: /bin/bash
    create_home: true
    state: present
  register: sandbar_user_result

- name: Give the installation user disjoint subordinate id ranges
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ sandbar_user }}:"
    line: "{{ sandbar_user }}:{{ sandbar_subid_start }}:{{ sandbar_subid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/subuid
    - /etc/subgid
  register: sandbar_subids

- name: Enable linger for the installation user
  ansible.builtin.command: loginctl enable-linger {{ sandbar_user }}
  args:
    creates: "/var/lib/systemd/linger/{{ sandbar_user }}"

- name: Wait for the installation user's manager to come up
  ansible.builtin.wait_for:
    path: "/run/user/{{ sandbar_user_result.uid }}/bus"
    timeout: 30

- name: Migrate the installation user's podman storage after a range change
  ansible.builtin.command: podman system migrate
  become: true
  become_user: "{{ sandbar_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbar_user_result.uid }}"
  changed_when: true
  when: sandbar_subids is changed

- name: Authorize the operator's keys for the installation user, and no others
  ansible.posix.authorized_key:
    user: "{{ sandbar_user }}"
    key: "{{ sandbar_operator_ssh_keys | join('\n') }}"
    exclusive: true

- name: Set the installation user's git identity
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: user.name, value: "{{ sandbar_installation_git_name }}" }
    - { name: user.email, value: "{{ sandbar_installation_git_email }}" }
  become: true
  become_user: "{{ sandbar_user }}"

- name: Route GitHub HTTPS credentials through gh
  community.general.git_config:
    name: credential.https://github.com.helper
    value: "!/usr/bin/gh auth git-credential"
    scope: global
  become: true
  become_user: "{{ sandbar_user }}"
