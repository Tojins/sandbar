---
- name: Read what the installation user's manager is delegated  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl show "user@{{ sandbar_user_result.uid }}.service" --property=DelegateControllers --value
  register: sandbar_delegated
  changed_when: false

- name: Refuse an installation user manager without memory or pids delegation
  ansible.builtin.assert:
    that:
      - "'memory' in sandbar_delegated.stdout.split()"
      - "'pids' in sandbar_delegated.stdout.split()"
    fail_msg: >-
      {{ sandbar_user }}'s user manager delegates only
      '{{ sandbar_delegated.stdout }}'; rootless podman needs memory and pids.

- name: Enable the installation user's podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ sandbar_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbar_user_result.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbar_user_result.uid }}/bus"
