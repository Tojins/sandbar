---
# Secrets are placed by hand, once, and never enter a repository (README,
# "By hand"). The role only checks that they are there.
- name: Look for the consumer checkout
  ansible.builtin.stat:
    path: "{{ sandbar_checkout }}/package.json"
  register: sandbar_checkout_stat

- name: Stop unless the checkout was cloned as the service user
  ansible.builtin.assert:
    that:
      - sandbar_checkout_stat.stat.exists
      - sandbar_checkout_stat.stat.pw_name == sandbar_user
    fail_msg: >-
      {{ sandbar_checkout }} is not a checkout owned by {{ sandbar_user }}.
      Clone it by hand as that user first (README, "By hand").

- name: Look for the credentials placed by hand
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ sandbar_secret_files }}"
  loop_control:
    label: "{{ item.path }}"
  register: sandbar_secret_stats

- name: Stop unless every credential exists, is owned by the service user and has mode {{ sandbar_secret_mode }}
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == sandbar_user
      - item.stat.mode == sandbar_secret_mode
    fail_msg: >-
      {{ item.item.path }}:
      {{ 'missing' if not item.stat.exists
         else 'owner ' ~ item.stat.pw_name ~ ', mode ' ~ item.stat.mode }}.
      Place it by hand as {{ sandbar_user }} with mode {{ sandbar_secret_mode }}
      (README, "By hand"), then rerun.
    quiet: true
  loop: "{{ sandbar_secret_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
