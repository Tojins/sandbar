---
- name: Refuse to run without the variables the role cannot default
  ansible.builtin.assert:
    that:
      - sandbar_checkout | length > 0
      - sandbar_git_email | length > 0
      - sandbar_operator_ssh_keys | length > 0
    fail_msg: >-
      Set sandbar_checkout, sandbar_git_email and sandbar_operator_ssh_keys in
      the inventory (inventory.example.yml). The key list is exclusive: a key
      not listed is removed from root and the service user.

# 24.04's podman 4.9 equals the podman-remote client the gate images bake;
# 26.04's 5.x is newer than it, the safe direction. Debian 12's 4.3 is OLDER
# than the client, which is the one direction skew bites, so it is refused.
- name: Refuse a host that is not Ubuntu 24.04 or 26.04
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in sandbar_ubuntu_releases
    fail_msg: >-
      This role targets Ubuntu {{ sandbar_ubuntu_releases | join(' or ') }};
      this host is {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_version'] }}.

- name: Install packages
  ansible.builtin.import_tasks: packages.yml

- name: Create the service user
  ansible.builtin.import_tasks: user.yml

- name: Configure rootless podman
  ansible.builtin.import_tasks: podman.yml

- name: Reconcile the AppArmor profiles rootless podman runs under
  ansible.builtin.import_tasks: apparmor.yml

- name: Provide swap
  ansible.builtin.import_tasks: swap.yml

- name: Restrict SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Configure unattended upgrades
  ansible.builtin.import_tasks: upgrades.yml

- name: Check the credentials placed by hand
  ansible.builtin.import_tasks: secrets.yml

- name: Install the daemon unit
  ansible.builtin.import_tasks: service.yml

- name: Configure the always-on run UI
  ansible.builtin.import_tasks: ui.yml
  when: sandbar_ui_port > 0
