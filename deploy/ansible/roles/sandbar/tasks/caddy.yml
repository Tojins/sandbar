---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Configure Caddy for the first installation reader
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  vars:
    sandbar_caddy_reader_port: "{{ sandbar_installations[0].reader_port }}"
  notify: Reload Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
