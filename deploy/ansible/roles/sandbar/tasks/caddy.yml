---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Create the installation index directory
  ansible.builtin.file:
    path: "{{ sandbar_ui_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# A static file rather than a `respond` heredoc: Ubuntu's packaged Caddy
# (2.6.2 on 24.04 and 26.04) predates heredoc support, which arrived in 2.7.
- name: Render the installation index
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ sandbar_ui_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Configure Caddy installation routes and index
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Reload Caddy

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started

# The first play is expected to stop later on a missing hand-placed env file.
# Apply this host-global change now; a handler deferred past that refusal would
# be lost, and the next unchanged template would not notify it again. Starting
# first also makes reload valid when package installation did not auto-start it.
- name: Apply the Caddy configuration before installation checks can stop the play
  ansible.builtin.meta: flush_handlers
