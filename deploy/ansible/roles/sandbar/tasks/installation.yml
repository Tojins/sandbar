---
- name: Check the required installation files
  ansible.builtin.stat:
    path: "{{ sandbar_installation_dir }}/{{ item }}"
  loop:
    - sandbar.config.mjs
    - sandbar.env
  register: sandbar_installation_files

- name: Stop unless every required installation file exists
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.item != 'sandbar.env' or (item.stat.pw_name | default('')) == sandbar_user
      - item.item != 'sandbar.env' or (item.stat.mode | default('')) == sandbar_secret_mode
    fail_msg: >-
      {{ sandbar_installation_dir }}/{{ item.item }}:
      {{ 'missing' if not item.stat.exists
         else 'owner ' ~ (item.stat.pw_name | default('unknown')) ~
              ', mode ' ~ (item.stat.mode | default('unknown')) }}.
      Place it as {{ sandbar_user }}{% if item.item == 'sandbar.env' %} with
      mode {{ sandbar_secret_mode }}{% endif %}, or set config_src to copy it,
      then rerun the play.
    quiet: true
  loop: "{{ sandbar_installation_files.results }}"
  loop_control:
    label: "{{ sandbar_installation_dir }}/{{ item.item }}"

- name: Clone the consumer repository
  ansible.builtin.git:
    repo: "{{ sandbar_installation.clone_url }}"
    dest: "{{ sandbar_checkout }}"
    update: true
  become: true
  become_user: "{{ sandbar_user }}"

- name: Read the installation user's uid
  ansible.builtin.command: id -u {{ sandbar_user }}
  register: sandbar_user_uid
  changed_when: false

- name: Keep the work directory out of the consumer repository
  ansible.builtin.lineinfile:
    path: "{{ sandbar_checkout }}/.git/info/exclude"
    line: "/{{ sandbar_work_dir }}/"
    create: true
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0644"

- name: Install the daemon unit
  ansible.builtin.include_tasks: service.yml

- name: Install the standalone UI unit
  ansible.builtin.include_tasks: ui.yml

# Continuous deployment's last step (#146). The play never restarts a daemon
# itself: a restart while an issue is running or landing would abort that work.
# It leaves the commit it applied in the installation directory instead, and the
# daemon drains and exits for it at a moment of its own choosing. A stopped
# daemon is left stopped — exits 1, 2 and 4 are stops a human inspects, and a
# converging play that started them would turn those into a retry loop; the
# request simply waits, and a start clears it.
#
# Host-level changes are deliberately not in this condition: unattended security
# upgrades already replace packages under a running daemon, so a box-wide freeze
# would not buy an invariant this box has today and would couple the
# installations' queues.
- name: Ask the daemon to restart into what this play changed
  ansible.builtin.copy:
    content: "{{ sandbar_driver_commit }}\n"
    dest: "{{ sandbar_installation_dir }}/{{ sandbar_restart_request_file }}"
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0600"
  when: >-
    sandbar_driver_flip is changed
    or sandbar_installation_files_changed[sandbar_user] | default(false)
    or sandbar_daemon_unit is changed
    or sandbar_ui_unit is changed
