---
- name: Create the installation directory
  ansible.builtin.file:
    path: "{{ sandbar_installation_dir }}"
    state: directory
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0700"

- name: Copy the installation configuration supplied by inventory
  ansible.builtin.copy:
    src: "{{ sandbar_installation.config_src }}/"
    dest: "{{ sandbar_installation_dir }}/"
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    directory_mode: "0700"
    mode: preserve
  when: sandbar_installation.config_src is defined
  register: sandbar_installation_copy

# Keyed by user, because this pass and the unit pass are two separate loops over
# the installation list: a bare register would hold only the last entry's result
# by the time installation.yml asks whether THIS installation's files moved.
- name: Remember whether this installation's files changed
  ansible.builtin.set_fact:
    sandbar_installation_files_changed: >-
      {{ sandbar_installation_files_changed | default({})
         | combine({sandbar_user: sandbar_installation_copy is changed}) }}
