---
- name: Install the standalone UI unit
  ansible.builtin.template:
    src: sandbar-ui.service.j2
    dest: "{{ sandbar_home }}/.config/systemd/user/sandbar-ui.service"
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0644"
  register: sandbar_ui_unit

- name: Create the daemon unit's UI drop-in directory
  ansible.builtin.file:
    path: "{{ sandbar_home }}/.config/systemd/user/sandbar.service.d"
    state: directory
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0755"

- name: Make a daemon start pull its standalone UI in
  ansible.builtin.copy:
    dest: "{{ sandbar_home }}/.config/systemd/user/sandbar.service.d/ui.conf"
    content: |
      [Unit]
      Wants=sandbar-ui.service
    owner: "{{ sandbar_user }}"
    group: "{{ sandbar_user }}"
    mode: "0644"

- name: Enable the standalone UI unit at boot
  ansible.builtin.systemd_service:
    name: sandbar-ui.service
    scope: user
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ sandbar_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbar_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbar_user_uid.stdout }}/bus"

# The one thing this play does restart, because the reader aborts no work by
# being restarted: it reads the event record off disk and serves it. A daemon's
# own restart is the daemon's decision (#146), and systemd's automatic restart
# does not propagate to this unit, so without this the page an operator reads
# would stay on whatever build was current when the reader last started.
- name: Restart the reader onto the current driver
  ansible.builtin.systemd_service:
    name: sandbar-ui.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ sandbar_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbar_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbar_user_uid.stdout }}/bus"
  when: sandbar_driver_flip is changed or sandbar_ui_unit is changed
