---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded

# A replaced profile applies to the pasta processes already running under it.
- name: Reload the pasta AppArmor profile
  ansible.builtin.command: apparmor_parser --replace /etc/apparmor.d/usr.bin.pasta
  changed_when: true
