---
# Host and installation data for BOTH deploy channels (#146).
#
# It lives beside `site.yml` rather than in an inventory because the box's own
# `ansible-pull` runs the play against a one-host inventory (`-i localhost,`)
# and therefore has no `inventory_dir` to anchor anything to. Ansible loads
# `group_vars/` adjacent to the playbook in both channels, and `playbook_dir`
# resolves to this directory in both, so every path below is anchored there.
#
# `inventory.yml` keeps only the host the operator's bootstrap connects to.
sandbar_git_name: sandbar
sandbar_git_email: demanthomas+sandbar@gmail.com

# The operator's public key stays an invocation-time value on the bootstrap
# channel:
#   SANDBAR_OPERATOR_SSH_KEY="$(cat ~/.ssh/id_ed25519.pub)" ansible-playbook ...
# An unattended pull supplies nothing here and the role falls back to the keys
# the last bootstrap made the box remember (tasks/main.yml).
sandbar_operator_ssh_keys:
  - "{{ lookup('ansible.builtin.env', 'SANDBAR_OPERATOR_SSH_KEY') }}"

# The Hetzner volume agents' database copies live on (#200). The role formats
# it XFS with reflink only while it is blank and mounts it at sandbar_db_mount;
# a rebuilt box with a fresh volume names the new one here.
sandbar_db_volume: /dev/disk/by-id/scsi-0HC_Volume_107295065

# One entry per daemon: its Linux user, consumer clone, Caddy route, reader port
# and the directory copied into `~/installation/`. No driver pin — every
# installation runs the one build of main this box made (roles/sandbar/tasks/
# driver.yml), so a config and the driver that reads it come from one commit.
sandbar_installations:
  - user: outdoor
    project: outdoor
    subid_slot: 0
    clone_url: https://github.com/Tojins/outdoor.git
    reader_port: 7332
    config_src: "{{ playbook_dir }}/installations/outdoor"
    # Where prod pushes its nightly dump (Tojins/outdoor#781). The key is
    # prod's public push key, generated on prod; the box holds nothing that
    # can reach prod. `push_from` (prod's egress address) is optional.
    dump_drop:
      user: outdoor-dump
      push_key: ""
  - user: outdoorpub
    project: outdoorpub
    subid_slot: 2
    clone_url: https://github.com/Tojins/outdoorpub.git
    reader_port: 7336
    config_src: "{{ playbook_dir }}/installations/outdoorpub"
  - user: sandbar
    project: sandbar
    subid_slot: 1
    clone_url: https://github.com/Tojins/sandbar.git
    reader_port: 7333
    config_src: "{{ playbook_dir }}/installations/sandbar"
