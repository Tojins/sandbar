---
# Copy to inventory.yml and fill in the host and public key. Each list entry is
# one independent Linux user, clone, installation directory and unit pair.
all:
  hosts:
    sandbar-box:
      ansible_host: 203.0.113.10
      ansible_user: root
  vars:
    sandbar_driver_tag: github:Tojins/sandbar#v0.40.1
    sandbar_git_name: sandbar-bot
    sandbar_git_email: sandbar-bot@example.invalid
    sandbar_ui_http_port: 80
    sandbar_operator_ssh_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... operator@laptop"
    sandbar_installations:
      - user: project-one
        project: project-one
        clone_url: https://github.com/example/project-one.git
        reader_port: 7332
        # Optional. Omit this and place the installation files by another
        # route; a relative path should be anchored to inventory_dir.
        config_src: "{{ inventory_dir }}/installations/project-one"
      - user: project-two
        project: project-two
        clone_url: https://github.com/example/project-two.git
        # An installation may override the box default, but it is still exact.
        driver_tag: github:Tojins/sandbar#v0.39.7
        reader_port: 7333
