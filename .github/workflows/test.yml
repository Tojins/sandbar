# The independent verdict `mergeMode: "verified"` buys (#39).
#
# The local gate runs this same suite inside a container that has no podman, so
# the `describe.runIf` blocks in `gate-stack-podman.test.ts` and
# `ensure-images-podman.test.ts` resolve false at COLLECTION time and ~35 tests
# skip — green either way. Those are precisely the tests that pin what podman
# defines: the tcp settle window's green-on-red, root-in-pod file ownership,
# `inspect` 125 vs `container exists` (#36), SIGKILL reaping, `logs -f` chunk
# splitting. This job is where they actually run, on a sha nothing has landed
# from yet.
#
# `sandbar.config.mjs` names this job in `mergeMode.requiredChecks`, as the
# forge reports it: `test`. The two are one unit — a required check name that
# never appears is `missing-required`, which is fatal every cycle by design. Do
# not add a matrix here without changing that line in the same commit; a matrix
# renames the checks to `test (24.x)` and the run would halt on every cycle.
name: test

on:
  push:
    # Branches only, not tags: auto-tag.yml pushes a tag at the same sha main
    # was already verified at. `**` (rather than a list) is what puts a check on
    # `sandbar/integration`, which is the whole point — verified mode polls that
    # scratch ref's sha before anything fast-forwards onto main.
    branches: ['**']
  workflow_dispatch:

# Deliberately no `concurrency: cancel-in-progress`. A cancelled run concludes
# as neither success nor failure, and sandbar polls a specific sha — cancelling
# one it is waiting on would read as an unknown verdict rather than as a saved
# minute.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Inside sandbar's 20-minute `checkTimeoutMs`, on purpose: the suite runs
    # in ~3 minutes, so a job still going at 15 is wedged, and a red job is an
    # actionable verdict where a cycle parked on `checks-timeout` is not.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Make podman and its test image available
        run: |
          set -euo pipefail
          podman --version
          podman pull docker.io/library/mariadb:10.11
          # `podman image exists <img>` is the EXACT predicate both podman test
          # files evaluate to decide whether to run. Asserting it here is what
          # keeps a missing runtime or a failed pull from reproducing the local
          # blind spot one level up — 35 silently-skipped tests and a green
          # required check.
          podman image exists docker.io/library/mariadb:10.11

      - run: npm run check

      - run: npm test
